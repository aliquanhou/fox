name: FOX CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Format check
      run: cargo fmt --check

    - name: Clippy (no warnings)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Check
      run: cargo check --workspace

    - name: Build
      run: cargo build --workspace

    - name: Unit tests
      run: cargo test --workspace --lib

    - name: Golden validation tests
      run: cargo test -p fox-analysis --test golden_validation

    - name: Ground truth validation tests
      run: cargo test -p fox-analysis --test ground_truth_validation

    - name: Robustness tests
      run: cargo test -p fox-analysis --test robustness

    - name: P0-3.4R Negative tests
      run: cargo test -p fox-analysis --test p0_3_4r_negative_tests

    - name: P0-4.1 Pipeline tests
      run: cargo test -p fox-analysis --test p0_4_1_pipeline_tests

    - name: Full test suite (excluding slow ground truth, already run above)
      run: cargo test --workspace -- --skip ground_truth_validation
