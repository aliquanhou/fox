name: FOX CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy (no warnings)
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Check
      run: cargo check --workspace --verbose

    - name: Build
      run: cargo build --workspace --verbose

    - name: Unit tests
      run: cargo test --workspace --verbose

    - name: Robustness tests
      run: cargo test -p fox-analysis --test robustness --verbose

    - name: Integration tests
      run: cargo test --test '*' --verbose

    - name: Build golden samples
      run: cd samples && cargo build --release
      continue-on-error: true

    - name: Golden tests
      run: cargo test --test golden --verbose
      continue-on-error: true

  # Future jobs (P0-2+):
  # fuzz:
  # sanitizer:
  # regression:
  # benchmark:
